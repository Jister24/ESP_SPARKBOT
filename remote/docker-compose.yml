# 极空间 Z2Pro —— SparkBot 远程访问隧道
#
# 用法：极空间 → Docker → 新增项目（Compose）→ 项目名填 frpc → 粘贴本文件 → 创建
#
# 把下面的 /PATH_TO_DOCKER 换成极空间里的真实路径：
# 在 Compose 编辑页点「查询路径」，选中 Docker 下的 frpc 文件夹即可直接复制。
# 本机实际形如：/tmp/zfsv3/sata1/<账号>/data/Docker/frpc
#
# 作用：把局域网里 ESP32 的 8080（控制）/ 8081（图传）隧道到阿里云，
#       设备本身零改动，小智的云端链路完全不受影响。
#
# 镜像用的是 snowdreamtech/frpc（Docker Hub 直连不通，官方镜像走镜像源也行，
# 见 nas-deploy.md）。这个镜像的 ENTRYPOINT 是包装脚本，必须覆盖掉：
#   - 默认 KEEPALIVE=1 会让容器停在 tail -f /dev/null，frpc 根本不启动；
#   - 默认 ENTRYPOINT 会把 command 当成要 exec 的完整命令，
#     写成 `command: -c /etc/frp/frpc.toml` 会报找不到 `-c`。
# 所以下面同时覆盖 entrypoint 和设置 KEEPALIVE=0。

services:
  frpc:
    image: snowdreamtech/frpc:latest
    container_name: frpc
    restart: unless-stopped
    entrypoint: ["/usr/bin/frpc"]
    command: ["-c", "/etc/frp/frpc.toml"]
    environment:
      - KEEPALIVE=0
    volumes:
      - /PATH_TO_DOCKER/frpc:/etc/frp:rw
