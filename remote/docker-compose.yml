# 极空间 Z2Pro —— SparkBot 远程访问隧道
#
# 用法：极空间 → Docker → 新增项目（Compose）→ 项目名填 frpc → 粘贴本文件 → 创建
#
# 把下面的 /PATH_TO_DOCKER 换成极空间里的真实路径：
# 在 Compose 编辑页点「查询路径」，选中 Docker 下的 frpc 文件夹即可直接复制。
# 本机实际形如：/tmp/zfsv3/sata1/<账号>/data/Docker/frpc
#
# 作用：把局域网里 ESP32 的 8080（控制）/ 8081（图传）隧道到阿里云，
#       设备本身零改动，小智的云端链路完全不受影响。
#
# 镜像带 docker.1panel.live 前缀：国内直连 registry-1.docker.io 会超时，
# 而极空间自带的「仓库」搜索走的是 Docker Hub API，同样搜不到。

services:
  frpc:
    image: docker.1panel.live/fatedier/frpc:v0.71.1
    container_name: frpc
    restart: unless-stopped
    command: -c /etc/frp/frpc.toml
    volumes:
      - /PATH_TO_DOCKER/frpc:/etc/frp:rw
