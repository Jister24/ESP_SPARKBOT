# Nginx 片段 —— 追加到你已有域名的 server 块内
#
# 作用：给 frp 隧道出来的两个端口套上 HTTPS + Basic 鉴权
#      手机访问 https://bot.example.com/bot/... 和 /botcam/...
#
# 生效：nginx -t && systemctl reload nginx
#
# 账号自己生成，不要用文档里的任何示例值：
#   htpasswd -c /etc/nginx/.sparkbot <用户名>
#
# ⚠️ 鉴权文件权限：必须 root:www-data + 640。
# 写成 root:root 会得到 500 而不是 401——nginx worker 是 www-data，
# 打不开文件，错误只落在 error.log 的 [crit] open() failed (13: Permission denied)，
# 浏览器端只看到一个空白 500，极难判断是权限问题。
#
#   chown root:www-data /etc/nginx/.sparkbot && chmod 640 /etc/nginx/.sparkbot
#   printf 'sparkbot:%s\n' "$(openssl passwd -apr1 '密码')" > /etc/nginx/.sparkbot

# ---------- 控制（8080） ----------
# /bot/status  →  http://127.0.0.1:18080/status
# /bot/move?x=0&y=1  →  http://127.0.0.1:18080/move?x=0&y=1
location /bot/ {
    auth_basic "SparkBot";
    auth_basic_user_file /etc/nginx/.sparkbot;

    # 尾斜杠会把 /bot/ 前缀剥掉，对上游根路径
    proxy_pass http://127.0.0.1:18080/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";

    # 控制指令要求快，超时就报错，别让用户以为按了没反应
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# ---------- 图传（8081） ----------
# /botcam/stream    →  MJPEG 连续流
# /botcam/snapshot  →  单帧 JPEG
location /botcam/ {
    auth_basic "SparkBot";
    auth_basic_user_file /etc/nginx/.sparkbot;

    proxy_pass http://127.0.0.1:18081/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";

    # 下面三行是 MJPEG 的关键。
    # 不开 buffering off，Nginx 会把画面攒在缓冲区凑够一块才发，
    # 表现是手机上一卡一卡、延迟越滚越大，看起来像固件挂了。
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # 图传是长连接，超时必须放大，否则 60s 后自动断流
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---------- 可选的备用放行（不建议开） ----------
# 如果你有固定公网 IP 且想跳过鉴权做本地调试，只允许指定来源：
#
# location /bot/ {
#     allow 192.168.1.0/24;
#     deny all;
#     proxy_pass http://127.0.0.1:18080/;
# }
